schema: spec-driven

context: |
  RetroNix: a custom CP/M BIOS plus Unix-flavored shell for real 8080/Z80
  hardware (TRS-80, S-100), backed by a serial-connected server that acts as
  filesystem, software library, and ROM foundry. The PRD is docs/RetroNix-PRD.md;
  read it before drafting proposals. Five pillars: real CPU only (no emulation
  of the machine's own code), Unix feel over CP/M, a boot ladder that never
  dead-ends, server as filesystem + library, server as ROM foundry.
  Domain vocabulary lives in CONTEXT.md; decisions in docs/adr/ (see
  docs/agents/domain.md). Emulator-first development against SIMH AltairZ80.

